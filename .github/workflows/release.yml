name: Build and Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 版本号唯一来源: src/version.txt（纯数字）
# tag 自动派生: v<version.txt>-<yyyymmdd-hhmmss>，无需手动输入

on:
  # 推 tag 触发（发版）：git tag v1.9.12 && git push origin v1.9.12
  # 不再对分支 push 自动构建，避免每次提交都发版
  push:
    tags:
      - 'v*'
  # 手动触发（补发/重跑）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read Go version from go.mod
        id: get_go_version
        run: |
          ver=$(awk '/^go[[:space:]]+/ {print $2; exit}' go.mod)
          if [ -z "$ver" ]; then
            echo "No 'go' directive found in go.mod" >&2
            exit 1
          fi
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.get_go_version.outputs.version }}
          cache: true
          cache-dependency-path: go.mod

      - name: Ensure module dependencies
        if: always()
        run: |
          if [ -f go.mod ]; then
            go mod tidy
          fi

      # 编译逻辑复用 tools/compiler.sh（与 CNB .cnb.yml 同一份脚本）
      # 内部: 读 src/version.txt + BUILD_TIME 只算一次(所有平台共用) + 注入 main.buildTime
      # + 写 bin/VERSION、bin/BUILD_TIME
      - name: Build for all platforms (tools/compiler.sh)
        env:
          CGO_ENABLED: 0
        run: bash tools/compiler.sh

      - name: Compute tag
        id: tag
        run: echo "tag=$(cat bin/VERSION)-$(cat bin/BUILD_TIME)" >> "$GITHUB_OUTPUT"

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets..."
            gh release upload "$TAG" bin/*.zip bin/*.tar.gz bin/SHA256SUMS.txt --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" bin/*.zip bin/*.tar.gz bin/SHA256SUMS.txt \
              --title "Release $TAG" \
              --notes "TCPing $TAG

          开源地址:
          - GitHub: https://github.com/2959916298/tcping
          - CNB: https://cnb.cool/l1094/tcping"
          fi
